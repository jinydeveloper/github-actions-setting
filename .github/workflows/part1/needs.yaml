# needs
# 하나의 워크플로우에서 여러 개의 잡을 사용하는 경우가 많음

# 깃헙 액션 job 간의 종속성을 생성
# 하나의 job이 다른 job 또는 여러 job이 완료될 때 실행되도록 사용
# 즉 여러 job의 실행 순서를 조절

# needs를 실행하는 경우
# 테스트 job이 실행되고, 그 job이 성공할 때 배포 job이 실행되도록 구성



name: needs
on: push

# job1과 job3이 병렬로 실행
# job2는 job1이 완료된 후 실행
# job4는 job3이 완료된 후 실행 > 현재 실패 처리로 실행 안 됨
jobs:
  job1:
    runs-on: ubuntu-latest
    steps:
      - name: echo
        run: echo "job1 done"
  
  job2:
    runs-on: ubuntu-latest
    needs: [job1]
    steps:
      - name: echo
        run: echo "job2 done"

  job3:
    runs-on: ubuntu-latest
    steps:
      - name: echo
        run: | 
          echo "job3 failed"
          exit 1

  job4:
    runs-on: ubuntu-latest
    needs: [job3]
    steps:
      - name: echo
        run:  echo "job3 done"
