# 수동으로 트리거
# default branch에서만 동작

# workflow dispatch를 사용하여 수동으로 트리거 가능

# 인풋값을 넣을 수 있음

# yaml 파일 업로드, actions 탭에서 사이드에 workflow-dispatch 클릭
# "Run workflow" 버튼을 클릭하여 인풋값을 넣고 실행

name: workflow-dispatch
on:
  workflow_dispatch:
    inputs:
      name:
        description: 'set name' 
        required: true
        default: 'github-actions'
        type: string
      environment:
        description: 'set env'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - qa
          - prod
jobs:
    workflow_dispatch:
        runs-on: ubuntu-latest
        steps:
        - name: step1
          run: echo Hello, World!
        - name: step2
          run: |
            echo hello world
            echo github actions
        - name: echo inputs
          run: |
            echo ${{ inputs.name}}
            echo ${{ inputs.enviroment }}
        